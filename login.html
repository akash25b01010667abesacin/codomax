<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlogNexus | Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container">
        <a class="brand" href="index.html">BlogNexus</a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          ☰
        </button>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="create-blog.html">Create Blog</a>
          <a class="active" href="login.html">Login</a>
          <a class="btn small" href="register.html">Register</a>
        </div>
      </nav>
    </header>

    <main class="auth-page">
      <div class="container auth-card">
        <div class="auth-copy">
          <p class="eyebrow">Welcome back</p>
          <h1>Sign in to continue writing.</h1>
          <p>Access your dashboard, manage your stories, and keep your readers engaged.</p>
        </div>
        <form class="form-card" data-feedback="Welcome back! Your dashboard is ready." novalidate>
          <label>
            Email
            <input type="email" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" placeholder="Enter your password" required />
          </label>
          <button class="btn primary" type="submit">Log in</button>
          <p class="form-link">Need an account? <a href="register.html">Register here</a></p>
          <div class="feedback" aria-live="polite"></div>
        </form>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
